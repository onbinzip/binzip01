<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>카카오톡 - 아이폰 18 Pro Max</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: #1c1c1e; font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  }
  .phone {
    position: relative; width: 430px; height: 932px; background: #000;
    border-radius: 58px; padding: 12px;
    box-shadow: inset 0 0 0 3px #2a2a2c, inset 0 0 0 5px #000, 0 30px 60px rgba(0,0,0,.6);
  }
  .screen {
    position: relative; width: 100%; height: 100%; border-radius: 46px; overflow: hidden;
    background: #000; display: flex; flex-direction: column;
  }
  .island {
    position: absolute; top: 11px; left: 50%; transform: translateX(-50%);
    width: 126px; height: 37px; background: #000; border-radius: 20px; z-index: 50;
  }
  .statusbar {
    height: 54px; flex-shrink: 0; display: flex; align-items: center; justify-content: space-between;
    padding: 6px 34px 0 46px; font-size: 17px; font-weight: 600; background: #000; color: #fff; position: relative; z-index: 10;
  }
  .statusbar .icons { display: flex; align-items: center; gap: 6px; }
  .home-ind {
    position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%);
    width: 140px; height: 5px; border-radius: 3px; background: #000; z-index: 60;
  }
  .view { display: none; flex: 1; flex-direction: column; min-height: 0; }
  .view.active { display: flex; }

  /* 채팅 목록 */
  .list-header { padding: 8px 16px 10px; font-size: 26px; font-weight: 700; color: #fff; }
  .profile-row { display: flex; align-items: center; gap: 12px; padding: 8px 16px 14px; border-bottom: 1px solid #2c2c2e; }
  .avatar-default {
    width: 44px; height: 44px; border-radius: 16px; background: #3a3a3c; display: flex; align-items: center; justify-content: center; overflow: hidden; flex-shrink: 0;
  }
  .avatar-default svg { width: 28px; height: 28px; fill: #8e8e93; }
  .profile-name { font-size: 16px; font-weight: 700; color: #fff; }
  .chat-item { display: flex; align-items: center; gap: 12px; padding: 12px 16px; cursor: pointer; }
  .chat-item:active { background: #1c1c1e; }
  .chat-item .avatar {
    width: 46px; height: 46px; border-radius: 18px; background: linear-gradient(180deg,#c9c9fb,#a8a9f6); flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
  }
  .chat-item .info { flex: 1; min-width: 0; }
  .chat-item .title-row { display: flex; align-items: center; gap: 4px; font-size: 16px; font-weight: 600; color: #fff; }
  .chat-item .last { font-size: 14px; color: #98989f; margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .chat-item .meta { font-size: 12px; color: #999; text-align: right; }
  .pin-icon { width: 14px; height: 16px; fill: #8e8e93; margin-left: 4px; flex-shrink: 0; }

  /* 채팅방 */
  .room-header {
    position: relative; display: flex; align-items: center; justify-content: space-between; padding: 6px 12px 8px; background: #000; flex-shrink: 0;
  }
  .back-pill {
    display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 14px 0 10px; border-radius: 22px; background: rgba(60,60,64,.75); color: #fff; cursor: pointer;
  }
  .back { font-size: 30px; line-height: 1; color: #fff; }
  .room-title { position: absolute; left: 50%; transform: translateX(-50%); white-space: nowrap; font-size: 17px; font-weight: 700; color: #fff; display: flex; align-items: center; gap: 4px; }
  .unread-count { font-weight: 400; color: #888; font-size: 15px; }
  .room-icons { display: flex; align-items: center; gap: 18px; height: 40px; padding: 0 16px; border-radius: 22px; background: rgba(60,60,64,.75); color: #fff; margin-left: auto; }
  .room-body { flex: 1; background: #000; display: flex; flex-direction: column; min-height: 0; }
  .past-bar {
    position: relative; margin: 6px -12px 6px; padding: 3px 0; text-align: center; background: #1c1c1e;
    font-size: 12px; color: #aeaeb2; cursor: pointer; flex-shrink: 0;
  }
  .past-bar::before, .past-bar::after {
    content: ''; position: absolute; left: 0; right: 0; height: 4px; background-repeat: repeat-x; background-size: 8px 4px;
  }
  .past-bar::before {
    top: -4px; background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='8' height='4'><path d='M0 4 L4 0 L8 4 Z' fill='%231c1c1e'/></svg>");
  }
  .past-bar::after {
    bottom: -4px; background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='8' height='4'><path d='M0 0 L4 4 L8 0 Z' fill='%231c1c1e'/></svg>");
  }
  .past-bar:active { background: #2c2c2e; }
  .messages { flex: 1; overflow-y: auto; padding: 4px 12px 12px; }
  .messages::-webkit-scrollbar { display: none; }
  .date-chip {
    text-align: center; margin: 12px 0; font-size: 12px; color: #fff; background: #1c1c1e;
    border-radius: 999px; padding: 5px 12px; width: fit-content; margin-left: auto; margin-right: auto;
  }
  .msg-row { display: flex; margin-bottom: 4px; align-items: flex-end; gap: 6px; }
  .msg-row.me { justify-content: flex-end; }
  .msg-row.other { justify-content: flex-start; }
  .msg-group { display: flex; flex-direction: column; }
  .sender { font-size: 13px; color: #aeaeb2; margin: 6px 0 3px 46px; }
  .other-line { display: flex; align-items: flex-start; gap: 8px; }
  .small-avatar { width: 38px; height: 38px; border-radius: 15px; background: linear-gradient(180deg,#c9c9fb,#a8a9f6); flex-shrink: 0; display: flex; align-items: center; justify-content: center; color: #888; font-size: 16px; }
  .bubble {
    max-width: 240px; padding: 9px 12px; font-size: 15px; line-height: 1.4; border-radius: 18px; word-break: keep-all; white-space: pre-wrap;
  }
  .me .bubble { background: #fee500; border-top-right-radius: 4px; color: #111; }
  .other .bubble { background: #262628; border-top-left-radius: 4px; color: #fff; }
  .photo {
    width: 180px; height: 230px; border-radius: 14px; object-fit: cover; background: linear-gradient(160deg,#c9d6df,#8fa3b1);
    display: flex; align-items: center; justify-content: center; color: #fff; font-size: 14px; font-weight: 600;
    text-shadow: 0 1px 3px rgba(0,0,0,.3); overflow: hidden;
  }
  .time { font-size: 11px; color: #8e8e93; white-space: nowrap; align-self: flex-end; margin-bottom: 2px; }
  .msg-row.me .time { order: -1; }
  .sticker { width: 120px; height: 120px; object-fit: contain; background: none; display: block; }
  .reply-bubble { min-width: 150px; }
  .rb-head { font-size: 15px; font-weight: 700; color: #fff; }
  .rb-quote { font-size: 15px; color: #fff; margin-top: 3px; }
  .rb-line { height: 1px; background: #4a4a4c; margin: 8px 0; }
  .rb-text { font-size: 15px; color: #fff; }

  .input-bar {
    display: flex; align-items: center; gap: 8px; padding: 8px 10px 26px; background: #1c1c1e; border-top: 1px solid #2c2c2e; flex-shrink: 0;
  }
  .input-bar .plus {
    width: 32px; height: 32px; border-radius: 50%; border: none; background: #888; color: #fff; font-size: 22px; line-height: 1; cursor: pointer;
  }
  .input-bar input {
    flex: 1; height: 36px; border-radius: 18px; border: 1px solid #3a3a3c; padding: 0 14px; font-size: 15px; background: #2c2c2e; color: #fff; outline: none;
  }
  .input-bar .send {
    height: 34px; padding: 0 12px; border-radius: 17px; border: none; background: #fee500; font-size: 14px; font-weight: 600; cursor: pointer;
  }

  /* 홈 탭 */
  .home-top { display: flex; align-items: center; justify-content: space-between; padding: 8px 16px 14px; }
  .home-me { display: flex; align-items: center; gap: 12px; }
  .home-icons { display: flex; align-items: center; gap: 20px; }
  .home-icons svg { display: block; }
  .home-scroll { flex: 1; overflow-y: auto; min-height: 0; }
  .home-scroll::-webkit-scrollbar { display: none; }
  .sec-title { font-size: 13px; color: #8e8e93; padding: 10px 16px 6px; }
  .sec-row { display: flex; align-items: center; gap: 12px; padding: 8px 16px; }
  .sec-row .avatar-default { width: 44px; height: 44px; }
  .avatar-img { width: 44px; height: 44px; border-radius: 16px; object-fit: cover; flex-shrink: 0; display: block; }
  .avatar-purple { width: 44px; height: 44px; border-radius: 16px; background: linear-gradient(180deg,#c9c9fb,#a8a9f6); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .sec-row .name { font-size: 16px; color: #fff; }
  .friend-head { display: flex; justify-content: space-between; align-items: center; padding: 16px 16px 8px; font-size: 13px; color: #8e8e93; }
  .dots-v { display: flex; flex-direction: column; align-items: center; gap: 7px; padding: 18px 0 30px; }
  .dots-v span { width: 5px; height: 5px; border-radius: 50%; background: #fff; display: block; }
  .dots-v span:nth-child(1) { opacity: .7; }
  .dots-v span:nth-child(2) { opacity: .4; }
  .dots-v span:nth-child(3) { opacity: .15; }
  .gap-dots { display: flex; flex-direction: column; align-items: center; gap: 5px; padding: 12px 0 4px; }
  .gap-dots span { width: 4px; height: 4px; border-radius: 50%; background: #fff; display: block; }
  .gap-dots span:nth-child(1) { opacity: .7; }
  .gap-dots span:nth-child(2) { opacity: .4; }
  .gap-dots span:nth-child(3) { opacity: .15; }

  /* 하단 탭바 */
  .tabbar { display: flex; justify-content: space-around; align-items: center; height: 80px; padding: 0 40px 22px; background: #000; border-top: 1px solid #1c1c1e; flex-shrink: 0; }
  .tab-btn { position: relative; background: none; border: none; cursor: pointer; padding: 6px 14px; }
  .tab-badge { position: absolute; top: 0; right: 2px; min-width: 20px; height: 18px; padding: 0 6px; border-radius: 9px; background: #ff3b30; color: #fff; font-size: 11px; font-weight: 700; line-height: 18px; text-align: center; }
  .avatar-purple svg { width: 26px; height: 26px; }
  .tab-btn svg { fill: #8e8e93; display: block; }
  .tab-btn.active svg { fill: #fff; }

  /* 알림창 */
  .modal-wrap {
    position: absolute; inset: 0; background: rgba(0,0,0,.4); display: none; align-items: center; justify-content: center; z-index: 40; padding: 0 30px;
  }
  .modal-wrap.show { display: flex; }
  .modal {
    width: 100%; background: #fff; border-radius: 16px; padding: 24px 22px 22px; text-align: left; overflow: hidden;
  }
  .modal .msg { font-size: 14px; line-height: 1.6; color: #6b6b6b; white-space: pre-wrap; text-align: left; }
  .modal .m-title { display: block; font-size: 17px; font-weight: 800; color: #111; margin-bottom: 0; }
  .modal .btn {
    border: 1px solid #d9d9d9; border-radius: 12px; margin-top: 20px; padding: 14px 0; font-size: 15px; color: #111; text-align: center; cursor: pointer;
  }
</style>
</head>

  function render() {
    const box = document.getElementById('messages');
    box.innerHTML = '';
    const bar = document.createElement('div');
    bar.className = 'past-bar';
    bar.textContent = '지난 대화 보기';
    bar.onclick = showModal;
    box.appendChild(bar);
    const chip = document.createElement('div');
    chip.className = 'date-chip';
    chip.textContent = (currentRoom === 'saku' ? '2026년 4월 9일 수요일' : DATE_LABEL) + ' ›';
    box.appendChild(chip);

    messages.forEach((m, i) => {
      if (m.type === 'ellipsis') {
        const d = document.createElement('div');
        d.className = 'gap-dots';
        d.innerHTML = '<span></span><span></span><span></span>';
        box.appendChild(d);
        return;
      }
      if (m.type === 'date') {
        const c = document.createElement('div');
        c.className = 'date-chip';
        c.textContent = m.label + ' ›';
        box.appendChild(c);
        return;
      }
      const prev = messages[i - 1];
      const showSender = m.who === 'other' && (!prev || prev.who !== 'other');
      const row = document.createElement('div');
      row.className = 'msg-row ' + m.who;
      const next = messages[i + 1];
      const sameNext = !!next && next.who === m.who;
      const sameMinute = sameNext && next.time === m.time;

      let content;
      if (m.type === 'sticker') {
        content = document.createElement('img');
        content.className = 'sticker';
        content.src = m.src;
        content.alt = m.label || '이모티콘';
        content.onerror = function () {
          const fallback = document.createElement('div');
          fallback.className = 'bubble';
          fallback.textContent = m.label || '이모티콘';
          this.replaceWith(fallback);
        };
      } else if (m.type === 'photo') {
        content = document.createElement('img');
        content.className = 'photo';
        content.src = m.src || PHOTO_SRC;
        content.alt = m.label || '사진1';
        if ([PHOTO2_SRC, PHOTO5_SRC, PHOTO6_SRC].includes(m.src)) { content.style.width = '240px'; content.style.height = '180px'; }
        content.onerror = function () {
          const fallback = document.createElement('div');
          fallback.className = 'photo';
          fallback.textContent = m.label || '사진1';
          this.replaceWith(fallback);
        };
      } else if (m.type === 'reply') {
        content = document.createElement('div');
        content.className = 'bubble reply-bubble';
        content.innerHTML = '<div class="rb-head"></div><div class="rb-quote"></div><div class="rb-line"></div><div class="rb-text"></div>';
        content.querySelector('.rb-head').textContent = m.head;
        content.querySelector('.rb-quote').textContent = m.quote;
        content.querySelector('.rb-text').textContent = m.text;
      } else {
        content = document.createElement('div');
        content.className = 'bubble';
        content.textContent = m.text;
      }
      const time = document.createElement('span');
      time.className = 'time';
      time.textContent = m.time;
      if (sameMinute) time.style.display = 'none';
      row.style.marginBottom = sameMinute ? '2px' : (sameNext ? '8px' : '14px');

      if (m.who === 'other') {
        const wrap = document.createElement('div');
        wrap.className = 'msg-group';
        if (showSender) {
          const avatar = document.createElement('div');
          avatar.className = 'other-line';
          const av = document.createElement('div');
          av.className = 'small-avatar';
          av.innerHTML = currentRoom === 'saku' ? '<img src="image/profile_saku.jpg" style="width:38px;height:38px;border-radius:15px;object-fit:cover;">' : AVATAR_SVG;
          const s = document.createElement('div');
          s.className = 'sender';
          s.style.margin = '0 0 3px 0';
          s.textContent = currentRoom === 'saku' ? '사쿠' : '원빈이';
          const col = document.createElement('div');
          col.appendChild(s);
          col.appendChild(Object.assign(document.createElement('div'), { className: 'other-line' }));
          avatar.appendChild(av);
          const right = document.createElement('div');
          right.style.display = 'flex';
          right.style.flexDirection = 'column';
          right.appendChild(s);
          const line = document.createElement('div');
          line.style.display = 'flex';
          line.style.alignItems = 'flex-end';
          line.style.gap = '6px';
          line.appendChild(content);
          line.appendChild(time);
          right.appendChild(line);
          avatar.appendChild(right);
          wrap.appendChild(avatar);
        } else {
          const line = document.createElement('div');
          line.style.display = 'flex';
          line.style.alignItems = 'flex-end';
          line.style.gap = '6px';
          line.style.marginLeft = '46px';
          line.appendChild(content);
          line.appendChild(time);
          wrap.appendChild(line);
        }
        row.appendChild(wrap);
      } else {
        row.style.flexDirection = 'row';
        row.appendChild(time);
        row.appendChild(content);
      }
      box.appendChild(row);
    });
    box.scrollTop = box.scrollHeight;
  }

  function showModal() { document.getElementById('modal').classList.add('show'); }

  function sendMsg() {
    const input = document.getElementById('chatInput');
    const text = input.value.trim();
    if (!text) return;
    const now = new Date();
    const h = now.getHours();
    const mm = String(now.getMinutes()).padStart(2, '0');
    const ampm = h < 12 ? '오전' : '오후';
    const hh = h % 12 === 0 ? 12 : h % 12;
    messages.push({ who: 'me', text, time: `${ampm} ${hh}:${mm}` });
    input.value = '';
    render();
  }
