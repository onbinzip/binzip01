<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>카카오톡 - 아이폰 18 Pro Max</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: #1c1c1e; font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  }
  .phone {
    position: relative; width: 430px; height: 932px; background: #000;
    border-radius: 58px; padding: 12px;
    box-shadow: inset 0 0 0 3px #2a2a2c, inset 0 0 0 5px #000, 0 30px 60px rgba(0,0,0,.6);
  }
  .screen {
    position: relative; width: 100%; height: 100%; border-radius: 46px; overflow: hidden;
    background: #fff; display: flex; flex-direction: column;
  }
  .island {
    position: absolute; top: 11px; left: 50%; transform: translateX(-50%);
    width: 126px; height: 37px; background: #000; border-radius: 20px; z-index: 50;
  }
  .statusbar {
    height: 54px; flex-shrink: 0; display: flex; align-items: center; justify-content: space-between;
    padding: 6px 34px 0 46px; font-size: 17px; font-weight: 600; background: inherit; position: relative; z-index: 10;
  }
  .statusbar .icons { font-size: 13px; letter-spacing: 2px; }
  .home-ind {
    position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%);
    width: 140px; height: 5px; border-radius: 3px; background: #000; z-index: 60;
  }
  .view { display: none; flex: 1; flex-direction: column; min-height: 0; }
  .view.active { display: flex; }

  /* 채팅 목록 */
  .list-header { padding: 8px 16px 10px; font-size: 26px; font-weight: 700; }
  .profile-row { display: flex; align-items: center; gap: 12px; padding: 8px 16px 14px; border-bottom: 1px solid #eee; }
  .avatar-default {
    width: 46px; height: 46px; border-radius: 50%; background: #e6e6e6; display: flex; align-items: center; justify-content: center; overflow: hidden;
  }
  .avatar-default svg { width: 28px; height: 28px; fill: #bdbdbd; }
  .profile-name { font-size: 16px; font-weight: 700; }
  .chat-item { display: flex; align-items: center; gap: 12px; padding: 12px 16px; cursor: pointer; }
  .chat-item:active { background: #f2f2f2; }
  .chat-item .avatar {
    width: 46px; height: 46px; border-radius: 18px; background: #d9d9d9; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center; font-size: 20px; color: #888;
  }
  .chat-item .info { flex: 1; min-width: 0; }
  .chat-item .title-row { display: flex; align-items: center; gap: 4px; font-size: 16px; font-weight: 600; }
  .chat-item .last { font-size: 14px; color: #777; margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .chat-item .meta { font-size: 12px; color: #999; text-align: right; }
  .pin { color: #f0a500; font-size: 13px; }

  /* 채팅방 */
  .room-header {
    display: flex; align-items: center; gap: 10px; padding: 6px 12px 8px; background: #fff; border-bottom: 1px solid #e5e5e5; flex-shrink: 0;
  }
  .back { font-size: 26px; cursor: pointer; width: 30px; color: #222; }
  .room-title { flex: 1; text-align: center; font-size: 17px; font-weight: 700; }
  .room-count { font-weight: 400; color: #888; font-size: 15px; margin-left: 2px; }
  .room-icons { width: 60px; text-align: right; font-size: 18px; color: #333; }
  .room-body { flex: 1; background: #b2c7d9; display: flex; flex-direction: column; min-height: 0; }
  .past-bar {
    margin: 8px 12px; padding: 9px 0; text-align: center; background: rgba(255,255,255,.55);
    border-radius: 18px; font-size: 14px; color: #333; cursor: pointer; flex-shrink: 0;
  }
  .past-bar:active { background: rgba(255,255,255,.8); }
  .messages { flex: 1; overflow-y: auto; padding: 4px 12px 12px; }
  .messages::-webkit-scrollbar { display: none; }
  .date-chip {
    text-align: center; margin: 12px 0; font-size: 12px; color: #fff; background: rgba(0,0,0,.25);
    border-radius: 12px; padding: 4px 12px; width: fit-content; margin-left: auto; margin-right: auto;
  }
  .msg-row { display: flex; margin-bottom: 4px; align-items: flex-end; gap: 6px; }
  .msg-row.me { justify-content: flex-end; }
  .msg-row.other { justify-content: flex-start; }
  .msg-group { display: flex; flex-direction: column; }
  .sender { font-size: 13px; color: #222; margin: 6px 0 3px 46px; }
  .other-line { display: flex; align-items: flex-start; gap: 8px; }
  .small-avatar { width: 38px; height: 38px; border-radius: 15px; background: #d9d9d9; flex-shrink: 0; display: flex; align-items: center; justify-content: center; color: #888; font-size: 16px; }
  .bubble {
    max-width: 240px; padding: 9px 12px; font-size: 15px; line-height: 1.4; border-radius: 18px; word-break: keep-all; white-space: pre-wrap;
  }
  .me .bubble { background: #fee500; border-top-right-radius: 4px; color: #111; }
  .other .bubble { background: #fff; border-top-left-radius: 4px; color: #111; }
  .photo {
    width: 180px; height: 230px; border-radius: 14px; object-fit: cover; background: linear-gradient(160deg,#c9d6df,#8fa3b1);
    display: flex; align-items: center; justify-content: center; color: #fff; font-size: 14px; font-weight: 600;
    text-shadow: 0 1px 3px rgba(0,0,0,.3); overflow: hidden;
  }
  .time { font-size: 11px; color: #3a4a57; white-space: nowrap; align-self: flex-end; margin-bottom: 2px; }
  .msg-row.me .time { order: -1; }

  .input-bar {
    display: flex; align-items: center; gap: 8px; padding: 8px 10px 26px; background: #f5f5f5; border-top: 1px solid #ddd; flex-shrink: 0;
  }
  .input-bar .plus {
    width: 32px; height: 32px; border-radius: 50%; border: none; background: #888; color: #fff; font-size: 22px; line-height: 1; cursor: pointer;
  }
  .input-bar input {
    flex: 1; height: 36px; border-radius: 18px; border: 1px solid #ddd; padding: 0 14px; font-size: 15px; background: #fff; outline: none;
  }
  .input-bar .send {
    height: 34px; padding: 0 12px; border-radius: 17px; border: none; background: #fee500; font-size: 14px; font-weight: 600; cursor: pointer;
  }

  /* 알림창 */
  .modal-wrap {
    position: absolute; inset: 0; background: rgba(0,0,0,.4); display: none; align-items: center; justify-content: center; z-index: 40; padding: 0 30px;
  }
  .modal-wrap.show { display: flex; }
  .modal {
    width: 100%; background: #fff; border-radius: 14px; padding: 22px 18px 0; text-align: center; overflow: hidden;
  }
  .modal .msg { font-size: 15px; line-height: 1.5; color: #222; padding-bottom: 18px; white-space: pre-wrap; text-align: center; }
  .modal .btn {
    border-top: 1px solid #e5e5e5; margin: 0 -18px; padding: 13px 0; font-size: 16px; color: #3a6fd8; font-weight: 600; cursor: pointer;
  }
</style>
</head>
<body>
<div class="phone">
  <div class="island"></div>
  <div class="screen" id="screen">
    <div class="statusbar">
      <span>9:41</span>
      <span class="icons">●●● ▲ ▮▮</span>
    </div>

    <!-- 채팅 목록 -->
    <div class="view active" id="view-list">
      <div class="list-header">채팅</div>
      <div class="profile-row">
        <div class="avatar-default">
          <svg viewBox="0 0 24 24"><path d="M12 12a4.5 4.5 0 1 0 0-9 4.5 4.5 0 0 0 0 9zm0 2c-3.3 0-9 1.7-9 5v2h18v-2c0-3.3-5.7-5-9-5z"/></svg>
        </div>
        <div class="profile-name">오시온</div>
      </div>
      <div class="chat-item" onclick="openRoom()">
        <div class="avatar">원</div>
        <div class="info">
          <div class="title-row"><span class="pin">📌</span>원빈이</div>
          <div class="last">어 안믿어</div>
        </div>
        <div class="meta">오후 11:42</div>
      </div>
    </div>

    <!-- 채팅방 -->
    <div class="view" id="view-room">
      <div class="room-header">
        <div class="back" onclick="closeRoom()">‹</div>
        <div class="room-title">원빈이 <span class="room-count">1</span></div>
        <div class="room-icons">⋯</div>
      </div>
      <div class="room-body">
        <div class="past-bar" onclick="showModal()">지난 대화 보기</div>
        <div class="messages" id="messages"></div>
        <div class="input-bar">
          <button class="plus">+</button>
          <input id="chatInput" type="text" placeholder="메시지를 입력하세요" onkeydown="if(event.key==='Enter')sendMsg()">
          <button class="send" onclick="sendMsg()">전송</button>
        </div>
      </div>
    </div>

    <!-- 알림창 -->
    <div class="modal-wrap" id="modal" onclick="if(event.target===this)hideModal()">
      <div class="modal">
        <div class="msg">대화를 불러올 수 없습니다.
확인하지 않은 대화 내용은 프라이버시 보호를 위해 서버에 3일간 보관 후 완전히 삭제됩니다. 톡클라우드를 구독하면 모든 대화를 백업하고 언제든 확인할 수 있어요!</div>
        <div class="btn" onclick="hideModal()">확인</div>
      </div>
    </div>

    <div class="home-ind"></div>
  </div>
</div>

<script>
  const DATE_LABEL = '20XX년 XX월 XX일';
  // 사진1 이미지 주소
  const PHOTO_SRC = 'images/photo1.jpg';

  // 대화 데이터 (보내는 사람: me / other, type: text / photo)
  const messages = [
    { who: 'me', type: 'photo', time: '오후 10:12' },
    { who: 'me', text: '오티인데 풀강을 하시네', time: '오후 10:12' },
    { who: 'other', text: '무슨 신입생보다', time: '오후 10:13' },
    { who: 'other', text: '더 꾸미고 다니냐', time: '오후 10:13' },
    { who: 'me', text: '잘보이고 싶은 사람 있어서', time: '오후 10:14' },
    { who: 'me', text: '어디야 ㅋ', time: '오후 10:14' },
    { who: 'other', text: '나 ㅋ 하나하는거 싫어해', time: '오후 10:15' },
    { who: 'me', text: '어디야 ㅋㅋ', time: '오후 10:15' },
    { who: 'other', text: '어차피 집 가면 볼건데', time: '오후 10:16' },
    { who: 'other', text: '왜 자꾸 물어봐', time: '오후 10:16' },
    { who: 'me', text: '같이 살면 행정법상 가족인데 알 건 알아야지', time: '오후 10:17' },
    { who: 'me', text: '서울에선 원래 룸메끼리 그러던데', time: '오후 10:17' },
    { who: 'other', text: '아 맞나', time: '오후 10:18' },
    { who: 'other', text: '구라지', time: '오후 10:18' },
    { who: 'me', text: '진짜임', time: '오후 10:19' },
    { who: 'other', text: '어 안믿어', time: '오후 11:42' }
  ];

  function render() {
    const box = document.getElementById('messages');
    box.innerHTML = '';
    const chip = document.createElement('div');
    chip.className = 'date-chip';
    chip.textContent = DATE_LABEL;
    box.appendChild(chip);

    messages.forEach((m, i) => {
      const prev = messages[i - 1];
      const showSender = m.who === 'other' && (!prev || prev.who !== 'other');
      const row = document.createElement('div');
      row.className = 'msg-row ' + m.who;

      let content;
      if (m.type === 'photo') {
        content = document.createElement('img');
        content.className = 'photo';
        content.src = PHOTO_SRC;
        content.alt = '사진1';
        content.onerror = function () {
          const fallback = document.createElement('div');
          fallback.className = 'photo';
          fallback.textContent = '사진1';
          this.replaceWith(fallback);
        };
      } else {
        content = document.createElement('div');
        content.className = 'bubble';
        content.textContent = m.text;
      }
      const time = document.createElement('span');
      time.className = 'time';
      time.textContent = m.time;

      if (m.who === 'other') {
        const wrap = document.createElement('div');
        wrap.className = 'msg-group';
        if (showSender) {
          const avatar = document.createElement('div');
          avatar.className = 'other-line';
          const av = document.createElement('div');
          av.className = 'small-avatar';
          av.textContent = '원';
          const s = document.createElement('div');
          s.className = 'sender';
          s.style.margin = '0 0 3px 0';
          s.textContent = '원빈이';
          const col = document.createElement('div');
          col.appendChild(s);
          col.appendChild(Object.assign(document.createElement('div'), { className: 'other-line' }));
          avatar.appendChild(av);
          const right = document.createElement('div');
          right.style.display = 'flex';
          right.style.flexDirection = 'column';
          right.appendChild(s);
          const line = document.createElement('div');
          line.style.display = 'flex';
          line.style.alignItems = 'flex-end';
          line.style.gap = '6px';
          line.appendChild(content);
          line.appendChild(time);
          right.appendChild(line);
          avatar.appendChild(right);
          wrap.appendChild(avatar);
        } else {
          const line = document.createElement('div');
          line.style.display = 'flex';
          line.style.alignItems = 'flex-end';
          line.style.gap = '6px';
          line.style.marginLeft = '46px';
          line.appendChild(content);
          line.appendChild(time);
          wrap.appendChild(line);
        }
        row.appendChild(wrap);
      } else {
        row.style.flexDirection = 'row';
        row.appendChild(time);
        row.appendChild(content);
      }
      box.appendChild(row);
    });
    box.scrollTop = box.scrollHeight;
  }

  function openRoom() {
    document.getElementById('view-list').classList.remove('active');
    document.getElementById('view-room').classList.add('active');
    render();
  }
  function closeRoom() {
    document.getElementById('view-room').classList.remove('active');
    document.getElementById('view-list').classList.add('active');
  }
  function showModal() { document.getElementById('modal').classList.add('show'); }
  function hideModal() { document.getElementById('modal').classList.remove('show'); }

  function sendMsg() {
    const input = document.getElementById('chatInput');
    const text = input.value.trim();
    if (!text) return;
    const now = new Date();
    const h = now.getHours();
    const mm = String(now.getMinutes()).padStart(2, '0');
    const ampm = h < 12 ? '오전' : '오후';
    const hh = h % 12 === 0 ? 12 : h % 12;
    messages.push({ who: 'me', text, time: `${ampm} ${hh}:${mm}` });
    input.value = '';
    render();
  }
</script>
</body>
</html>
